<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TOP E SHOP — ciemny motyw</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="mark" aria-hidden="true"></div>
      <div>
        <strong>TOP E SHOP</strong>
        <span>Ciemny motyw B2B</span>
      </div>
    </header>

    <button id="toggle" type="button" role="switch" aria-checked="true">
      <span class="switch" aria-hidden="true"><span class="knob"></span></span>
      <span class="copy">
        <span id="state">Włączony</span>
        <small id="hint">Pulpit, katalog, koszyk i zamówienia</small>
      </span>
    </button>

    <p id="scope">Działa na b2b.topeshop.pl. Zdjęcia produktów zostają bez zmian.</p>
    <script src="popup.js"></script>
  </body>
</html>
